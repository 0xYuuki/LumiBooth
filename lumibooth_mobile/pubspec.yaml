name: lumibooth_mobile
description: "A mobile photo booth for creating and sharing photo strips."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  camera: ^0.12.2
  flutter:
    sdk: flutter
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/frames/
    - assets/stickers/
    - assets/fonts/
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
    - family: Space Mono
      fonts:
        - asset: assets/fonts/SpaceMono.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf
